version: '3'

networks:
  nw:
    driver: bridge
  nw2:
    driver: bridge

services:

  user:
    container_name: user
    build:
      context: ./user
      dockerfile: DockerfileUser
    volumes:
      - ./user:/app
    ports:
      - "8080:8080"
    networks:
      - nw
    depends_on:
      - db-postgresql

  db-postgresql:
    container_name: db-postgresql
    image: postgres:latest  
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    networks:
      - nw

  pinpong:
    container_name: pingpong
    build:
      context: ./pingpong
      dockerfile: DockerfilePingPong
    command: python3 manage.py runserver 0.0.0.0:8081
    volumes:
      - ./pingpong:/app
    ports:
      - "8081:8081"
    networks:
      - nw2

  nginx:
    build: ./frontend
    container_name: frontendbi
    ports:
      - "8082:8082"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html/
    depends_on:
      - user
    networks:
      - nw

volumes:
  user_data:
  pingpong_data:

  